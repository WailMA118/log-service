services:
  postgres:
    image: postgres:16-alpine
    command: >
      postgres
      -c shared_buffers=256MB
      -c work_mem=16MB
      -c maintenance_work_mem=128MB
      -c max_wal_size=2GB
      -c checkpoint_completion_target=0.9
      -c gin_pending_list_limit=8MB
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-logs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-logs}
      POSTGRES_DB: ${POSTGRES_DB:-logs}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-logs} -d ${POSTGRES_DB:-logs}"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 1g
    cpus: "1.0"
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      DB_URL: postgres://${POSTGRES_USER:-logs}:${POSTGRES_PASSWORD:-logs}@postgres:5432/${POSTGRES_DB:-logs}
      POSTGRES_USER: ${POSTGRES_USER:-logs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-logs}
      POSTGRES_DB: ${POSTGRES_DB:-logs}
      DB_QUERY_POOL_MAX: ${DB_QUERY_POOL_MAX:-6}
      DB_INGEST_POOL_MAX: ${DB_INGEST_POOL_MAX:-4}
      RETENTION_DAYS: ${RETENTION_DAYS:-30}
      RETENTION_SWEEP_INTERVAL_MS: ${RETENTION_SWEEP_INTERVAL_MS:-3600000}
      NODE_OPTIONS: "${NODE_OPTIONS:---max-old-space-size=160}"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    mem_limit: 256m
    cpus: "0.5"

volumes:
  pgdata: